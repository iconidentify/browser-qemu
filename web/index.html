<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Direct visits to mac.dialtone.live should land on the full dialtone.live
      // experience. The dialtone.live/quick page embeds this app in an iframe, so
      // only redirect when we're the TOP window (a real visit), never when framed.
      // Done in JS (not nginx) because the front proxy doesn't pass Sec-Fetch-Dest
      // through to the origin, and the framed/not-framed check is proxy-independent.
      if (window.self === window.top && location.hostname === 'mac.dialtone.live') {
        location.replace('https://dialtone.live/');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dialtone</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Dialtone">
    <meta name="description" content="Classic Mac OS in your browser. Experience the warmth of vintage computing with full networking support.">
    <!-- Theme color with media queries for system dark mode support -->
    <meta name="theme-color" content="#E8E2D8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dialtone">
    <meta property="og:description" content="Classic Mac OS in your browser. Experience the warmth of vintage computing with full networking support.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dialtone">
    <meta name="twitter:description" content="Classic Mac OS in your browser. Experience the warmth of vintage computing with full networking support.">
    <meta name="twitter:image" content="/og-image.png">

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- PWA / iOS Fullscreen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Use 'default' to allow theme-color to control status bar color.
         'black-translucent' overrides theme-color entirely in Safari. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dialtone">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Universal iOS Safari text selection and context menu prevention */
      *,
      *::before,
      *::after {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
      }

      /* iOS Safari text selection and context menu prevention */
      html, body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -webkit-text-size-adjust: 100%;
        user-select: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }

      /* Prevent iOS rubber-banding */
      html {
        overflow: hidden;
        height: 100%;
        /* Tell Safari we support both color schemes */
        color-scheme: light dark;
      }

      body {
        overflow: hidden;
        height: 100%;
        position: fixed;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
