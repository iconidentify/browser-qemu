server {
  listen 80;
  server_name _;

  # Required for SharedArrayBuffer (COOP/COEP)
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  # Helpful default; allows same-origin embedding of resources
  add_header Cross-Origin-Resource-Policy "same-site" always;

  # Serve static assets
  root /usr/share/nginx/html;
  index index.html;

  # Cache policy. Default everything to no-cache (browsers must revalidate;
  # the ETag turns that into a cheap 304 unless the file actually changed) so
  # index.html, ROMs, and disk images are picked up immediately after a
  # deploy. Without this, heuristic caching serves a stale index.html whose
  # hashed bundle no longer exists, and the emulator never boots.
  # NOTE: uses `expires` rather than `add_header` because an add_header in a
  # location block would stop inheritance of the COOP/COEP headers above,
  # which would break SharedArrayBuffer.
  expires -1;

  # Content-hashed bundles are immutable - cache for a year
  location /assets/ {
    expires 1y;
  }

  # SPA fallback
  location / {
    # Best-effort server-side redirect of direct (top-level) visits to
    # dialtone.live, leaving iframe embeds (Sec-Fetch-Dest: iframe, the
    # dialtone.live/quick emulator) alone. NOTE: the front mac-ws-proxy does
    # not forward Sec-Fetch-Dest to this origin, so in production this rarely
    # fires - the authoritative redirect is the framed/not-framed check in
    # index.html, which is proxy-independent. Kept here as a no-flash path for
    # when the header is present (e.g. direct origin access).
    if ($http_sec_fetch_dest = "document") {
      return 302 https://dialtone.live/;
    }
    try_files $uri $uri/ /index.html;
  }

  # WebSocket ethernet bridge -> relay service
  location /ethernet {
    proxy_pass http://relay:8081/ethernet;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }
}
