<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="housing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="50%" stop-color="#EDE8DF"/>
      <stop offset="100%" stop-color="#D4CFC4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Housing -->
  <rect x="4" y="2" width="24" height="28" rx="3" fill="url(#housing)" filter="url(#shadow)"/>

  <!-- Screen bezel -->
  <rect x="7" y="5" width="18" height="16" rx="2" fill="#3A3832"/>

  <!-- Screen -->
  <rect x="8" y="6" width="16" height="14" rx="1" fill="#1A1918"/>

  <!-- Screen glow hint -->
  <rect x="9" y="7" width="14" height="12" rx="1" fill="#2A2824"/>

  <!-- Power LED -->
  <circle cx="10" cy="26" r="1.5" fill="#22C55E"/>
</svg>
